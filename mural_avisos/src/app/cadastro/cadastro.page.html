<ion-content class="ion-padding">
  <div class="fone-container">
    <div class="fone">
      
      <div class="header-box">
        <h2>Mural de Avisos</h2>
        <p class="subtitle">Criar nova conta</p>
      </div>

      <div class="aviso erro" *ngIf="mensagemErro">
        {{ mensagemErro }}
      </div>
      <div class="aviso sucesso" *ngIf="mensagemSucesso">
        {{ mensagemSucesso }}
      </div>

      <div class="form-group">
        <label class="label-field">E-mail</label>
        <input type="email" [(ngModel)]="email" placeholder="seu@email.com" class="input-field" />
      </div>

      <div class="form-group">
        <label class="label-field">Senha</label>
        <input type="password" [(ngModel)]="senha" placeholder="******" class="input-field" />
      </div>

      <button (click)="registrar()" class="btn main">
        Entrar
      </button>

      <button (click)="entrarComGoogle()" class="btn google">
        Entrar com Google
      </button>

      <div class="footer-link">
        <a routerLink="/login">Já tem uma conta? Faça login</a>
      </div>

    </div>
  </div>
</ion-content>
