<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideia Mural de Avisos</title>
<style>
/* Telefone fake — estilo print de aula */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #e2e8f0;
  color: #0f172a;
  padding: 24px 16px 48px;
}
.topo {
  max-width: 920px; margin: 0 auto 18px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
}
.topo h1 { font-size: 1.15rem; margin-right: auto; }
.topo span { font-size: 0.85rem; color: #64748b; }
.grid {
  max-width: 920px; margin: 0 auto;
  display: flex; flex-wrap: wrap; gap: 22px; justify-content: center;
}
.bloco { width: 300px; }
.bloco h2 {
  font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: #64748b; margin-bottom: 8px; text-align: center;
}
.fone {
  border-radius: 28px; overflow: hidden;
  box-shadow: 0 14px 36px rgba(15, 23, 42, 0.18);
  border: 3px solid #cbd5e1; background: #fff; min-height: 520px;
}
.tb {
  padding: 14px 12px; color: #fff; font-weight: 700; font-size: 0.95rem;
  display: flex; justify-content: space-between; align-items: center;
}
.pad { padding: 12px; }
.item {
  background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
  padding: 10px 12px; margin-bottom: 8px;
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
}
.item strong { font-size: 0.92rem; }
.item .preco { font-weight: 700; white-space: nowrap; }
.badge {
  display: inline-block; font-size: 0.7rem; font-weight: 700;
  padding: 2px 7px; border-radius: 999px; margin-top: 4px;
}
.badge.ok { background: #dcfce7; color: #166534; }
.badge.warn { background: #fef3c7; color: #92400e; }
.badge.bad { background: #fee2e2; color: #991b1b; }
.badge.off { background: #e2e8f0; color: #64748b; }
.btn {
  display: block; width: 100%; text-align: center; padding: 12px;
  border-radius: 12px; font-weight: 700; border: 0; margin-top: 10px;
  color: #fff; font-size: 0.95rem;
}
.btn.ghost { background: #e2e8f0; color: #475569; }
.aviso {
  border-radius: 10px; padding: 10px 12px; font-size: 0.85rem;
  margin: 8px 0; font-weight: 600;
}
.aviso.erro { background: #fee2e2; color: #991b1b; }
.aviso.info { background: #e0f2fe; color: #075985; }
.total {
  margin-top: 12px; padding-top: 10px; border-top: 1px dashed #cbd5e1;
  font-size: 0.92rem;
}
.total .linha { display: flex; justify-content: space-between; margin: 4px 0; }
.total .g { font-size: 1.05rem; font-weight: 800; }
.muted { color: #64748b; font-size: 0.8rem; }
.chip {
  display: inline-block; padding: 6px 10px; border-radius: 999px;
  background: #f1f5f9; font-size: 0.78rem; margin: 0 4px 6px 0; font-weight: 600;
}
.chip.on { background: #0f766e; color: #fff; }
.nota {
  max-width: 920px; margin: 20px auto 0; font-size: 0.88rem; color: #475569;
  background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 14px;
}
.nota strong { color: #0f172a; }

</style>
<style>
body{background:#fff;padding:16px 12px 32px}
.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}
.bloco h2{display:none}
.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}
.tb{background:#4d7c0f}
.btn.main{background:#4d7c0f}
.velho{opacity:.55}
</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Mural</span><span style="font-weight:600;font-size:0.8rem">agora</span></div>
      <div class="pad">
        <span class="chip on">Info</span><span class="chip">ADM</span><span class="chip">Lazer</span><span class="chip">Grêmio</span><span class="chip">Direção</span>
        <div class="item" style="margin-top:8px">
        <div>
        <strong>Prova de PDM</strong>
        <div class="muted">Info · expira em 2 h</div>
        <span class="badge warn">some sozinho</span>
        </div>
        </div>
        <div class="item"><div><strong>Reunião do grêmio</strong><div class="muted">Grêmio · sexta 12h</div></div></div>
        <div class="item velho"><div><strong>Cardápio da semana</strong><div class="muted">Direção</div><span class="badge off">expirou</span></div></div>
        <button class="btn main">Novo aviso</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
